<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IFrame</title>

    <meta name="fetch" content="true" />
    <meta
      name="description"
      content="Helper for embedding any kind of external resource (use either <code>src</code> or <code>srcdoc</code>). For more information see <br><a href='https://github.com/edrys-labs/module-iframe' target='_blank'>https://github.com/edrys-labs/module-iframe</a>"
    />
    <meta name="show-in" content="*" />
    <meta
      name="module-config"
      content="{
        'config': {
          'src': {
            'type': 'text',
            'hint': 'URL of the page to embed, for every role (the site must allow being embedded)',
          },
          'srcdoc': {
            'type': 'code-area',
            'hint': 'HTML to show instead, used when src is empty',
          }
        },
        'teacherConfig': {
          'src': {
            'type': 'text',
            'hint': 'Page for teachers only; replaces the general config',
          },
          'srcdoc': {
            'type': 'code-area',
            'hint': 'HTML for teachers only; replaces the general config',
          }
        },
        'studentConfig': {
          'src': {
            'type': 'text',
            'hint': 'Page for students only; replaces the general config',
          },
          'srcdoc': {
            'type': 'code-area',
            'hint': 'HTML for students only; replaces the general config',
          }
        },
        'stationConfig': {
          'src': {
            'type': 'text',
            'hint': 'Page for stations only; replaces the general config',
          },
          'srcdoc': {
            'type': 'code-area',
            'hint': 'HTML for stations only; replaces the general config',
          }
        }
      }"
    />

    <link rel="stylesheet" href="https://edrys-labs.github.io/module/vendor/water.min.css" />

    <style>
      /* the embedded page fills the module; water.css would centre and pad the body */
      html,
      body {
        height: 100%;
        max-width: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /* block, so no line box adds a few pixels and a scrollbar below it */
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* the display rule above would otherwise override the hidden attribute */
      [hidden] {
        display: none !important;
      }

      .message {
        margin: 0;
        padding: 1rem;
      }

      /* replaced by the page or the empty message; appears only after 0.5s, so fast loads don't flicker */
      .loading {
        opacity: 0;
        animation: show-loading 0s 0.5s forwards;
      }

      @keyframes show-loading {
        to {
          opacity: 0.6;
        }
      }
    </style>

    <script src="https://edrys-labs.github.io/module/edrys.js"></script>
  </head>
  <body>
    <p id="message" class="message loading">Loading&hellip;</p>

    <!-- the same permissions edrys-Lite grants this module, passed on to the embedded page -->
    <iframe
      title="Embedded page"
      allow="camera; microphone; fullscreen; display-capture; accelerometer; autoplay; encrypted-media; geolocation; gyroscope; magnetometer; midi; serial; vr; clipboard-read; clipboard-write"
      allowfullscreen
      hidden
    ></iframe>

    <script>
      // configs that could not be parsed stay strings, missing ones are null or ''
      const asObject = (config) => (config && typeof config === 'object' ? config : {})

      Edrys.onReady(() => {
        const iframe = document.querySelector('iframe')
        const message = document.getElementById('message')

        // a role config that sets src or srcdoc replaces the general one
        const general = asObject(Edrys.module.config)
        const role = asObject(Edrys.module[Edrys.role.toLowerCase() + 'Config'])
        const config = role.src || role.srcdoc ? role : general

        if (config.src) {
          iframe.src = config.src
        } else if (config.srcdoc) {
          iframe.srcdoc = config.srcdoc
        } else {
          message.classList.remove('loading')
          message.textContent =
            'Nothing to show yet: set src (a URL) or srcdoc (HTML) in the module settings.'
          return
        }

        message.hidden = true
        iframe.hidden = false
      })
    </script>
  </body>
</html>
